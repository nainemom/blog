<article class="post">
    <div class="header">
        <h2 class="title">
            <a href="{{ site.url }}{{ post.url }}">{{ post.data.title }}</a>
        </h2>
        <h5>
            <i class="fa fa-pencil"></i> {{ post.data.author }}
        </h5>
        <h5>
            <i class="fa fa-calendar-o"></i> {{ post.date | jdate: "%A، %d %b %y" }}
        </h5>
        <h5>
            <i class="fa fa-tag"></i> <a href="{{ site.url }}/category/{{ post.data.category | archiveSlug }}/">{{ post.data.category }}</a>
        </h5>
        <h5 class="tags">
            <i class="fa fa-tags"></i>
            {% for tag in post.data.tags %}
                <a href="{{ site.url }}/tag/{{ tag | archiveSlug }}/">{{ tag }}</a>
            {% endfor %}
        </h5>
    </div>
    <div class="body">
        {% if short %}
            {{ post | excerpt }}
            <a href="{{ site.url }}{{ post.url }}"> ادامه مطلب </a>
        {% else %}
            {{ body }}
        {% endif %}
    </div>
</article>
