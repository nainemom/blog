<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
{% if page.inputPath contains "/_posts/" %}
{% assign description = page | excerpt | strip_html | strip %}
<meta name="author" content="{{ author }}">
<meta property="og:type" content="article">
<meta property="og:title" content="{{ title }}">
<meta property="og:url" content="{{ site.absoluteUrl }}{{ page.url }}">
<meta property="og:description" content="{{ description }}">
<meta name="description" content="{{ description }}">
{% else %}
<meta name="author" content="{{ site.author }}">
<meta property="og:type" content="website">
<meta property="og:title" content="{{ site.name }}">
<meta property="og:description" content="{{ site.description }}">
<meta name="description" content="{{ site.description }}">
<meta property="og:url" content="{{ site.absoluteUrl }}/">
{% endif %}
<meta property="og:site_name" content="{{ site.name }}">
<meta property="og:locale" content="fa_IR">
<meta name="twitter:site" content="@{{ site.twitter_username }}">
<link rel="canonical" href="{{ site.absoluteUrl }}{{ page.url }}">
<link rel="alternate" type="application/atom+xml" title="{{ site.name }} - {{ site.description }}" href="/feed.xml" />
<title> {{ site.name }} – {% if title %}{{ title }}{% else %}{{ site.description }}{% endif %} </title>
