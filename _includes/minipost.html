<article class="minipost">
    <div class="header">
        <h3 class="title">
            <a href="{{ site.url }}{{ post.url }}">{{ post.data.title }}</a>
        </h3>
        <h5>
            <i class="fa fa-calendar-o"></i> {{ post.date | jdate: "%A، %d %b %y" }}
        </h5>
    </div>
    <div class="body"> {{ post | excerpt | strip_html | slice: 0, 150 }} </div>
</article>
